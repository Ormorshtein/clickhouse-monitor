services:

  # ── ClickHouse Keeper ──────────────────────────────────────
  ch-keeper-0:
    image: clickhouse/clickhouse-server:24.3
    container_name: ch-keeper-0
    hostname: ch-keeper-0
    volumes:
      - ./config/keeper/keeper_server.xml:/etc/clickhouse-server/config.d/keeper_server.xml
      - keeper-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 9181 2>/dev/null | grep -q imok || clickhouse-client --query 'SELECT 1' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── ClickHouse Replica 0 ──────────────────────────────────
  ch-clickhouse-0:
    image: clickhouse/clickhouse-server:24.3
    container_name: ch-clickhouse-0
    hostname: ch-clickhouse-0
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./config/shared/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./config/ch0/macros.xml:/etc/clickhouse-server/config.d/macros.xml
      - ./config/shared/users.xml:/etc/clickhouse-server/users.d/admin.xml
      - ch0-data:/var/lib/clickhouse
    depends_on:
      ch-keeper-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ── ClickHouse Replica 1 ──────────────────────────────────
  ch-clickhouse-1:
    image: clickhouse/clickhouse-server:24.3
    container_name: ch-clickhouse-1
    hostname: ch-clickhouse-1
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ./config/shared/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./config/ch1/macros.xml:/etc/clickhouse-server/config.d/macros.xml
      - ./config/shared/users.xml:/etc/clickhouse-server/users.d/admin.xml
      - ch1-data:/var/lib/clickhouse
    depends_on:
      ch-keeper-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ../dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - ch-clickhouse-0

volumes:
  keeper-data:
  ch0-data:
  ch1-data:
